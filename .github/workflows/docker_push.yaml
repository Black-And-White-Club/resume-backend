name: Build and push backend to OCIR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      semver_tag: ${{ steps.vars.outputs.semver_tag }}
      commit_short_sha: ${{ steps.vars.outputs.commit_short_sha }}
    env:
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_TENANCY_NAMESPACE: ${{ secrets.OCI_TENANCY_NAMESPACE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short git SHA and tag
        id: vars
        run: |
          shortSha=$(git rev-parse --short "${GITHUB_SHA}")
          semverTag="v1.0.${GITHUB_RUN_NUMBER}"
          echo "COMMIT_SHORT_SHA=$shortSha" >> "$GITHUB_ENV"
          echo "SEMVER_TAG=$semverTag" >> "$GITHUB_ENV"
          echo "commit_short_sha=$shortSha" >> "$GITHUB_OUTPUT"
          echo "semver_tag=$semverTag" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      # Removed debug steps (OCI CLI install and key dump) — not needed in CI for publishing.

      - name: Log in to OCIR (Docker login)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCI_REGION }}.ocir.io
          username: ${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Set up ko
        uses: ko-build/setup-ko@v0.9
        env:
          # Push directly to resume/backend so the resulting image repo matches our manifest
          KO_DOCKER_REPO: ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}/resume/backend

      - name: Publish image with ko
        id: publish
        env:
          # Ensure the pushed image repo path matches the manifest targeting us-ashburn-1.ocir.io/.../resume/backend
          KO_DOCKER_REPO: ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}/resume/backend
        run: |
          set -euo pipefail
          IMAGE_REPO="${OCI_REGION}.ocir.io/${OCI_TENANCY_NAMESPACE}/resume/backend"
          # Run ko publish and write a mapping of import path -> image reference to a YAML file
          IMAGE_REFS_FILE=/tmp/ko-image-refs.yaml
          ko publish --platform=linux/amd64,linux/arm64 --tags "${SEMVER_TAG},${COMMIT_SHORT_SHA}" --image-refs ${IMAGE_REFS_FILE} --bare .

          # Parse first non-empty line from the image refs file (supports both 'importpath: image' and plain image formats)
          RAW_LINE=$(awk 'NF{print; exit}' ${IMAGE_REFS_FILE} | sed -e 's/^\s*//' -e 's/\s*$//')
          if echo "${RAW_LINE}" | grep -q ': '; then
            # Format: importpath: image
            IMAGE_REF=$(echo "${RAW_LINE}" | awk -F': ' '{print $2}' | sed -e 's/^\s*//' -e 's/\s*$//')
          else
            # Format: just image ref
            IMAGE_REF="${RAW_LINE}"
          fi
          if [ -z "${IMAGE_REF}" ]; then
            echo "ERROR: could not parse image ref from ${IMAGE_REFS_FILE}" >&2
            exit 1
          fi

          echo "Discovered image ref: ${IMAGE_REF}"
          echo "Verifying digest pull: ${IMAGE_REF}"
          docker pull "${IMAGE_REF}"
          echo "Digest pull succeeded: ${IMAGE_REF}"
          echo "Verifying immutable semver tag: ${IMAGE_REPO}:${SEMVER_TAG}"
          docker pull "${IMAGE_REPO}:${SEMVER_TAG}"
          echo "Semver tag pull succeeded: ${IMAGE_REPO}:${SEMVER_TAG}"
          echo "Verifying immutable SHA tag: ${IMAGE_REPO}:${COMMIT_SHORT_SHA}"
          docker pull "${IMAGE_REPO}:${COMMIT_SHORT_SHA}"
          echo "SHA tag pull succeeded: ${IMAGE_REPO}:${COMMIT_SHORT_SHA}"
          # Export for any following steps or job outputs if needed
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
